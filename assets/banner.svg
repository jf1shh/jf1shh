  <text x="64" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="rgba(255,255,255,0.85)">17 years at Liberty Mutual, 11 as senior appraiser. Self-taught AI builder since March 2026.</text>
